name: Build NetScope for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --icon assets/netscope.ico --add-data "assets/netscope.png;assets" --name NetScope netscope.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-Windows-x64
          path: dist/NetScope.exe
          if-no-files-found: error
